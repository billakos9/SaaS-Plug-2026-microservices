$kind: http-request
name: Duplicate Register (Fail)
url: "{{gateway_url}}/auth/register"
method: POST
body:
  type: json
  content: |
    {
      "email": "{{gateway_registered_email}}",
      "password": "{{test_password}}",
      "name": "{{gateway_register_name}}",
      "phoneNumber": "{{gateway_register_phone}}"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("gateway duplicate register returns 409", () => {
        pm.response.to.have.status(409);
      });

      pm.test("gateway duplicate error mentions email", () => {
        const body = pm.response.text().toLowerCase();
        pm.expect(body).to.include("email");
      });
    language: text/javascript
order: 4000
