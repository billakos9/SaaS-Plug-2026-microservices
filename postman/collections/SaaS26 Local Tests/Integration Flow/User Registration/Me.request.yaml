$kind: http-request
name: Me
url: "{{user_url}}/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |
      pm.test("/user/me returns 200", () => {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();

      pm.test("/user/me returns the registered synced profile", () => {
        pm.expect(json.userId).to.eql(Number(pm.environment.get("registered_user_id")));
        pm.expect(json.email).to.eql(pm.environment.get("registered_email"));
        pm.expect(json.name).to.eql(pm.environment.get("register_name"));
      });

      pm.test("/user/me does not expose password fields", () => {
        pm.expect(json).to.not.have.property("password");
        pm.expect(json).to.not.have.property("passwordHash");
      });
    language: text/javascript
order: 4462892503250285
