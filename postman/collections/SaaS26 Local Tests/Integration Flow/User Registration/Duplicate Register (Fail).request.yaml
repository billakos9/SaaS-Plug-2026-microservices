$kind: http-request
name: Duplicate Register (Fail)
url: "{{auth_url}}/register"
method: POST
body:
  type: json
  content: |
    {
      "email": "{{registered_email}}",
      "password": "{{test_password}}",
      "name": "{{register_name}}",
      "phoneNumber": "{{register_phone}}"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("duplicate register returns 409", () => {
        pm.response.to.have.status(409);
      });

      pm.test("duplicate error mentions email", () => {
        const body = pm.response.text().toLowerCase();
        pm.expect(body).to.include("email");
      });
    language: text/javascript
order: 4495984492074068
