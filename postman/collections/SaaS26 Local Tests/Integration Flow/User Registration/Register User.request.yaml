$kind: http-request
name: Register User
url: "{{auth_url}}/register"
method: POST
body:
  type: json
  content: |
    {
      "email": "{{register_email}}",
      "password": "{{test_password}}",
      "name": "{{register_name}}",
      "phoneNumber": "{{register_phone}}"
    }
scripts:
  - type: beforeRequest
    code: |
      const stamp = Date.now();

      pm.environment.set("register_email", `postman_${stamp}@saasplug.app`);
      pm.environment.set("register_name", `Postman User ${stamp}`);
      pm.environment.set("register_phone", "6900000999");
      pm.environment.set("test_password", pm.environment.get("test_password") || "123456");
      pm.environment.unset("sync_retry");
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("register returns 201", () => {
        pm.response.to.have.status(201);
      });

      const json = pm.response.json();

      pm.test("register response has public auth user fields", () => {
        pm.expect(json).to.have.property("userId");
        pm.expect(json).to.have.property("email");
        pm.expect(json).to.have.property("role", "user");
      });

      pm.test("register does not expose password fields", () => {
        pm.expect(json).to.not.have.property("password");
        pm.expect(json).to.not.have.property("passwordHash");
      });

      pm.environment.set("registered_user_id", json.userId);
      pm.environment.set("registered_email", json.email);
    language: text/javascript
order: 1778930719510
