$kind: http-request
name: Register User
url: "{{auth_url}}/register"
method: POST
body:
  type: json
  content: |
    {
      "email": "{{standalone_register_email}}",
      "password": "{{test_password}}",
      "name": "{{standalone_register_name}}",
      "phoneNumber": "{{standalone_register_phone}}"
    }
scripts:
  - type: beforeRequest
    code: |
      const stamp = Date.now();

      pm.environment.set("standalone_register_email", `standalone_${stamp}@saasplug.app`);
      pm.environment.set("standalone_register_name", `Standalone User ${stamp}`);
      pm.environment.set("standalone_register_phone", "6900000998");
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("register returns 201", () => {
        pm.response.to.have.status(201);
      });

      const json = pm.response.json();

      pm.test("register response has userId, email, role", () => {
        pm.expect(json).to.have.property("userId");
        pm.expect(json).to.have.property("email");
        pm.expect(json).to.have.property("role", "user");
      });

      pm.test("register response does not expose passwordHash", () => {
        pm.expect(json).to.not.have.property("passwordHash");
        pm.expect(json).to.not.have.property("password");
      });

      pm.environment.set("standalone_registered_user_id", json.userId);
      pm.environment.set("standalone_registered_email", json.email);
    language: text/javascript
order: 1980
