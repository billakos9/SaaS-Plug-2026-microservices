# API Gateway - canonical public API is /api/*

upstream reservationService { server reservation-service:3000; }
upstream chargerService     { server charger-service:3000; }
upstream providerService    { server provider-service:3000; }
upstream adminService       { server admin-service:3000; }
upstream authService        { server auth-service:3000; }
upstream userService        { server user-service:3000; }
upstream analyticsService   { server analytics-service:3000; }
upstream billingService     { server billing-service:3000; }
upstream bluePlugAdapter    { server blueplug-adapter:3000; }
upstream redPlugAdapter     { server redplug-adapter:3000; }
upstream greenPlugAdapter   { server greenplug-adapter:3000; }

server {
    listen 80;
    client_max_body_size 25m;

    location = /api/reservations {
        proxy_pass http://reservationService/reservation;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/reservations/ {
        proxy_pass http://reservationService/reservation/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/reservations/health {
        return 404;
    }

    location = /api/chargers {
        proxy_pass http://chargerService/charger;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/chargers/ {
        proxy_pass http://chargerService/charger/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/chargers/health {
        return 404;
    }

    location = /api/providers {
        proxy_pass http://providerService/provider;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/providers/ {
        proxy_pass http://providerService/provider/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/providers/health {
        return 404;
    }

    location = /api/admin {
        proxy_pass http://adminService/admin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/admin/ {
        proxy_pass http://adminService/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/admin/health {
        return 404;
    }

    location = /api/auth {
        proxy_pass http://authService/auth;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/auth/ {
        proxy_pass http://authService/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/auth/health {
        return 404;
    }

    # Do not expose all user-service endpoints publicly.
    location = /api/users/me {
        proxy_pass http://userService/user/me;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location = /api/analytics {
        proxy_pass http://analyticsService/analytics;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/analytics/ {
        proxy_pass http://analyticsService/analytics/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/analytics/health {
        return 404;
    }

    location = /api/billing {
        proxy_pass http://billingService/billing;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/billing/ {
        proxy_pass http://billingService/billing/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/billing/health {
        return 404;
    }

    # Gateway-only adapter access for integration tests.
    location /api/adapters/blue/ {
        proxy_pass http://bluePlugAdapter/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/adapters/red/ {
        proxy_pass http://redPlugAdapter/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/adapters/green/ {
        proxy_pass http://greenPlugAdapter/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }
}
