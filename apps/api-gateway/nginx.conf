# API Gateway - Routes requests to microservices

upstream userService        { server user-service:3000; }
upstream authService        { server auth-service:3000; }
upstream reservationService { server reservation-service:3000; }
upstream chargerService     { server charger-service:3000; }
upstream analyticsService   { server analytics-service:3000; }
upstream providerService    { server provider-service:3000; }
upstream adminService       { server admin-service:3000; }


server {
    listen 80;


    location /users/ {
        proxy_pass http://userService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


    location /auth/ {
        proxy_pass http://authService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


    location /reservations/ {
        proxy_pass http://reservationService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


    location /chargers/ {
        proxy_pass http://chargerService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


    location /analytics/ {
        proxy_pass http://analyticsService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


    location /providers/ {
        proxy_pass http://providerService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


    location /admin/ {
        proxy_pass http://adminService/;
        proxy_set_header Host                      $host;
        proxy_set_header X-Real-IP                 $remote_addr;
        proxy_set_header X-Forwarded-For           $proxy_add_x_forwarded_for;
    }


}