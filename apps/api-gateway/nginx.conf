# API Gateway - canonical public API is /api/*

server {
    listen 80;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s;

    location = /api/reservations {
        set $upstream http://reservation-service:3000;
        rewrite ^ /reservation break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/reservations/ {
        set $upstream http://reservation-service:3000;
        rewrite ^/api/reservations/(.*)$ /reservation/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/reservations/health {
        return 404;
    }

    location = /api/chargers {
        set $upstream http://charger-service:3000;
        rewrite ^ /charger break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/chargers/ {
        set $upstream http://charger-service:3000;
        rewrite ^/api/chargers/(.*)$ /charger/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/chargers/health {
        return 404;
    }

    location = /api/providers {
        set $upstream http://provider-service:3000;
        rewrite ^ /provider break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/providers/ {
        set $upstream http://provider-service:3000;
        rewrite ^/api/providers/(.*)$ /provider/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/providers/health {
        return 404;
    }

    location = /api/admin {
        set $upstream http://admin-service:3000;
        rewrite ^ /admin break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/admin/ {
        set $upstream http://admin-service:3000;
        rewrite ^/api/admin/(.*)$ /admin/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/admin/health {
        return 404;
    }

    location = /api/auth {
        set $upstream http://auth-service:3000;
        rewrite ^ /auth break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/auth/ {
        set $upstream http://auth-service:3000;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/auth/health {
        return 404;
    }

    # Do not expose all user-service endpoints publicly.
    location = /api/users/me {
        set $upstream http://user-service:3000;
        rewrite ^ /user/me break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location = /api/analytics {
        set $upstream http://analytics-service:3000;
        rewrite ^ /analytics break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/analytics/ {
        set $upstream http://analytics-service:3000;
        rewrite ^/api/analytics/(.*)$ /analytics/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/analytics/health {
        return 404;
    }

    location = /api/billing {
        set $upstream http://billing-service:3000;
        rewrite ^ /billing break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/billing/ {
        set $upstream http://billing-service:3000;
        rewrite ^/api/billing/(.*)$ /billing/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Per-service health is internal-only (see /admin/system-health). Block public exposure.
    location = /api/billing/health {
        return 404;
    }

    # Gateway-only adapter access for integration tests.
    location /api/adapters/blue/ {
        set $upstream http://blueplug-adapter:3000;
        rewrite ^/api/adapters/blue/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/adapters/red/ {
        set $upstream http://redplug-adapter:3000;
        rewrite ^/api/adapters/red/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    location /api/adapters/green/ {
        set $upstream http://greenplug-adapter:3000;
        rewrite ^/api/adapters/green/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }
}
