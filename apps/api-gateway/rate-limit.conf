# Loaded inside nginx's http {} block via conf.d include (00- prefix loads first).
# $limit_key is empty ("") for Docker-local / test traffic → not counted → no limiting.
# $limit_key is $binary_remote_addr for all external traffic → rate limited.

geo $limit_key {
    default         $binary_remote_addr;
    127.0.0.0/8     "";   # loopback
    172.16.0.0/12   "";   # Docker bridge subnets (172.16.x.x – 172.31.x.x)
    10.0.0.0/8      "";   # Docker overlay / custom networks
}

# General zone: 30 req/s per real external IP
limit_req_zone  $limit_key  zone=api:10m       rate=30r/s;

# Auth zone: 10 req/min per real external IP (brute-force guard on login/register)
limit_req_zone  $limit_key  zone=api_auth:10m  rate=10r/m;

limit_req_status  429;
limit_conn_status 429;
