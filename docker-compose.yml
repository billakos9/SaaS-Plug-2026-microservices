name: SaasPlug
services:
  # # ---------- API Gateway ----------
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: docker/Dockerfile
    container_name: api_gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
    #    - user-service
      - auth-service
    #    - reservation-service
      - charger-service
    #   - analytics-service
    #    - provider-service
    #    - admin-service
    networks:
      - backend
  #
  # # ---------- Business Services ----------
  # user-service:
  #   build: ./services/user-service
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - MONGO_URL=mongodb://user-db:27017/user
  #   depends_on:
  #     - user-db
  #   networks:
  #     - backend

  auth-service:
    build: ./services/auth-service
    container_name: auth_service 
    ports:
      - "3002:3000"
    environment:
      - MONGO_URL=mongodb://auth-db:27017/auth
      - RABBITMQ_URL= amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-db
      - rabbitmq
    networks:
      - backend

  # reservation-service:
  #   build: ./services/reservation-service
  #   ports:
  #     - "3003:3000"
  #   environment:
  #     - MONGO_URL=mongodb://reservation-db:27017/reservation
  #     - RABBITMQ_URL=amqp://rabbitmq:5672
  #   depends_on:
  #     - reservation-db
  #     - rabbitmq
  #   networks:
  #     - backend

  charger-service:
    build: ./services/charger-service
    container_name: charger_service
    ports:
      - "3004:3000"
    depends_on:
      - charger-db
      - rabbitmq
    networks:
      - backend

    #   analytics-service:
    #     build: ./services/analytics-service
    #     ports:
    #       - "3005:3000"
    #     environment:
    #       - MONGO_URL=mongodb://analytics-db:27017/analytics
    #     depends_on:
    #       - analytics-db
    #     networks:
    #       - backend

    #   provider-service:
    #     build: ./services/provider-service
    #     ports:
    #       - "3006:3000"
    #     environment:
    #       - MONGO_URL=mongodb://provider-db:27017/provider
    #     depends_on:
    #       - provider-db
    #     networks:
    #       - backend

    #   admin-service:
    #     build: ./services/admin-service
    #     ports:
    #       - "3007:3000"
    #     environment:
    #       - MONGO_URL=mongodb://admin-db:27017/admin
    #     depends_on:
    #       - admin-db
    #     networks:
    #       - backend

    #   # ---------- Plug / Adapter Aggregator ----------
  plug-service:
    container_name: Plug-Service
    build: ./services/plug-service
    ports:
      - "3008:3000"
    depends_on:
      - rabbitmq
    networks:
      - backend

  # ---------- Provider Adapters ----------
  blueplug-adapter:
    container_name: BluePlug-Adapter
    build: ./services/plug-adapters/blue-plug-adapter
    ports:
      - "3009:3000"
    depends_on:
      - blueplug-db
    networks:
      - backend

  redplug-adapter:
    container_name: RedPlug-Adapter
    build: ./services/plug-adapters/red-plug-adapter
    ports:
      - "3010:3000"
    networks:
      - backend

  greenplug-adapter:
    container_name: GreenPlug-Adapter
    build: ./services/plug-adapters/green-plug-adapter
    ports:
      - "3011:3000"
    networks:
      - backend

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  # ---------- Mongo Databases ----------
  #   user-db:
  #     image: mongo:8
  #     ports:
  #       - "27011:27017"
  #     volumes:
  #       - user_data:/data/db
  #     networks:
  #       - backend

  auth-db:
    image: mongo:8
    container_name: auth_db
    ports:
      - "27012:27017"
    volumes:
      - auth_data:/data/db
    networks:
      - backend

  #   reservation-db:
  #     image: mongo:8
  #     ports:
  #       - "27013:27017"
  #     volumes:
  #       - reservation_data:/data/db
  #     networks:
  #       - backend

  charger-db:
    image: mongo:8
    container_name: charger_db
    ports:
      - "27014:27017"
    volumes:
      - charger_data:/data/db
    networks:
      - backend

  #   analytics-db:
  #     image: mongo:8
  #     ports:
  #       - "27015:27017"
  #     volumes:
  #       - analytics_data:/data/db
  #     networks:
  #       - backend

  #   provider-db:
  #     image: mongo:8
  #     ports:
  #       - "27016:27017"
  #     volumes:
  #       - provider_data:/data/db
  #     networks:
  #       - backend

  #   admin-db:
  #     image: mongo:8
  #     ports:
  #       - "27017:27017"
  #     volumes:
  #       - admin_data:/data/db
  #     networks:
  #       - backend

  #   # Optional: provider-specific DBs (as in your diagram)
  blueplug-db:
    container_name: bluePlug_db
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - blueplug_data:/data/db
    networks:
      - backend

  redplug-db:
    container_name: redPlug_db
    image: mongo:8
    ports:
      - "27019:27017"
    volumes:
      - redplug_data:/data/db
    networks:
      - backend

  greenplug-db:
    container_name: greenPlug_db
    image: mongo:8
    ports:
      - "27020:27017"
    volumes:
      - greenplug_data:/data/db
    networks:
      - backend

# ---------- Volumes ----------
volumes:
  #   user_data:
  auth_data:
  #   reservation_data:
  charger_data:
  #   analytics_data:
  #   provider_data:
  #   admin_data:
  blueplug_data:
  redplug_data:
  greenplug_data:

# ---------- Network ----------
networks:
  backend:
