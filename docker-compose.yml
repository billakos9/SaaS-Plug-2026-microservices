name: SaasPlug
services:
  # # ---------- API Gateway ----------
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: docker/Dockerfile
    container_name: api_gateway
    ports:
      - "80:80"
    depends_on:
      - user-service
      - auth-service
      - reservation-service
      - charger-service
      - provider-service
      - admin-service
      - analytics-service
      - billing-service
      - blueplug-adapter
      - redplug-adapter
      - greenplug-adapter
    networks:
      - backend
  #
  # # ---------- Business Services ----------
  user-service:
    build: ./services/user-service
    container_name: user_service
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://user-db:27017/user
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      user-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  auth-service:
    build: ./services/auth-service
    container_name: auth_service
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://auth-db:27017/auth
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
      - PROVIDER_REGISTRATION_CODE=saasplug-provider-2024
    depends_on:
      auth-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  reservation-service:
    build: ./services/reservation-service
    container_name: reservation_service
    ports:
      - "3003:3000"
    env_file:
      - path: ./services/reservation-service/.env.development.local
        required: false
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://reservation-db:27017/reservation
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - CHARGER_SERVICE_URL=http://charger-service:3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      reservation-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  charger-service:
    build: ./services/charger-service
    container_name: charger_service
    ports:
      - "3004:3000"
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://charger-db:27017/charger
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      charger-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  analytics-service:
    build: ./services/analytics-service
    container_name: analytics_service
    ports:
      - "3005:3000"
    env_file:
      - ./services/analytics-service/.env.development.local
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://analytics-db:27017/analytics
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - CHARGER_SERVICE_URL=http://charger-service:3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      analytics-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      charger-service:
        condition: service_started
    networks:
      - backend

  billing-service:
    build: ./services/billing-service
    container_name: billing_service
    ports:
      - "3012:3000"
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://billing-db:27017/billing
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      billing-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  provider-service:
    build: ./services/provider-service
    container_name: provider_service
    ports:
      - "3006:3000"
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://provider-db:27017/provider
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      provider-db:
        condition: service_started
    networks:
      - backend

  admin-service:
    build: ./services/admin-service
    container_name: admin_service
    ports:
      - "3007:3000"
    env_file:
      - path: ./services/admin-service/.env.development.local
        required: false
    environment:
      - PORT=3000
      - MONGOOSE_URL=mongodb://admin-db:27017/admin
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - PROVIDER_SERVICE_URL=http://provider-service:3000
      - USER_SERVICE_URL=http://user-service:3000
      - CHARGER_SERVICE_URL=http://charger-service:3000
      - ANALYTICS_SERVICE_URL=http://analytics-service:3000
      - AUTH_SERVICE_URL=http://auth-service:3000
      - RESERVATION_SERVICE_URL=http://reservation-service:3000
      - PLUG_SERVICE_URL=http://plug-service:3000
      - BLUE_PLUG_ADAPTER_URL=http://blueplug-adapter:3000
      - RED_PLUG_ADAPTER_URL=http://redplug-adapter:3000
      - GREEN_PLUG_ADAPTER_URL=http://greenplug-adapter:3000
      - BILLING_SERVICE_URL=http://billing-service:3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      admin-db:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - backend

  # ---------- Plug / Adapter Aggregator ----------
  plug-service:
    container_name: Plug-Service
    build: ./services/plug-service
    ports:
      - "3008:3000"
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - BLUE_PLUG_ADAPTER_URL=http://blueplug-adapter:3000/bluePlugAdapter
      - RED_PLUG_ADAPTER_URL=http://redplug-adapter:3000/redPlugAdapter
      - GREEN_PLUG_ADAPTER_URL=http://greenplug-adapter:3000/greenPlugAdapter
      - POLL_INTERVAL_MINUTES=15
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  # ---------- Provider Adapters ----------
  blueplug-adapter:
    container_name: BluePlug-Adapter
    build: ./services/plug-adapters/blue-plug-adapter
    ports:
      - "3009:3000"
    env_file:
      - path: ./services/plug-adapters/blue-plug-adapter/.env.development.local
        required: false
    environment:
      - PORT=3000
      - BLUE_PLUG_BASE_URL=https://davinci.softlab.ntua.gr/saas26/bluePlug/api
    networks:
      - backend

  redplug-adapter:
    container_name: RedPlug-Adapter
    build: ./services/plug-adapters/red-plug-adapter
    ports:
      - "3010:3000"
    env_file:
      - path: ./services/plug-adapters/red-plug-adapter/.env.development.local
        required: false
    environment:
      - PORT=3000
      - RED_PLUG_BASE_URL=https://davinci.softlab.ntua.gr/saas26/redPlug/api
    networks:
      - backend

  greenplug-adapter:
    container_name: GreenPlug-Adapter
    build: ./services/plug-adapters/green-plug-adapter
    ports:
      - "3011:3000"
    env_file:
      - path: ./services/plug-adapters/green-plug-adapter/.env.development.local
        required: false
    environment:
      - PORT=3000
      - GREEN_PLUG_BASE_URL=https://davinci.softlab.ntua.gr/saas26/greenPlug/api
    networks:
      - backend

  # ---------- Development Seeder ----------
  dev-seeder:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: services/dev-seeder/Dockerfile
    container_name: dev_seeder
    environment:
      - NODE_ENV=development
      - AUTH_MONGOOSE_URL=mongodb://auth-db:27017/auth
      - USER_MONGOOSE_URL=mongodb://user-db:27017/user
      - MOCK_USERS_FILE=/app/mock_data/users.json
    depends_on:
      - auth-db
      - user-db
    networks:
      - backend

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # ---------- Mongo Databases ----------
  user-db:
    image: mongo:8
    container_name: user_db
    ports:
      - "27011:27017"
    volumes:
      - user_data:/data/db
    networks:
      - backend

  auth-db:
    image: mongo:8
    container_name: auth_db
    ports:
      - "27012:27017"
    volumes:
      - auth_data:/data/db
    networks:
      - backend

  reservation-db:
    image: mongo:8
    container_name: reservation_db
    ports:
      - "27013:27017"
    volumes:
      - reservation_data:/data/db
    networks:
      - backend

  charger-db:
    image: mongo:8
    container_name: charger_db
    ports:
      - "27014:27017"
    volumes:
      - charger_data:/data/db
    networks:
      - backend

  analytics-db:
    image: mongo:8
    container_name: analytics_db
    ports:
      - "27015:27017"
    volumes:
      - analytics_data:/data/db
    networks:
      - backend

  provider-db:
    image: mongo:8
    container_name: provider_db
    ports:
      - "27016:27017"
    volumes:
      - provider_data:/data/db
    networks:
      - backend

  admin-db:
    image: mongo:8
    container_name: admin_db
    ports:
      - "27021:27017"
    volumes:
      - admin_data:/data/db
    networks:
      - backend

  billing-db:
    image: mongo:8
    container_name: billing_db
    ports:
      - "27022:27017"
    volumes:
      - billing_data:/data/db
    networks:
      - backend


# ---------- Volumes ----------
volumes:
  user_data:
  auth_data:
  reservation_data:
  charger_data:
  analytics_data:
  provider_data:
  admin_data:
  billing_data:

# ---------- Network ----------
networks:
  backend:
