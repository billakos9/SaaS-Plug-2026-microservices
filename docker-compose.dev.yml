# Local development/debug override.
# Use only when direct host access to services, DBs, and RabbitMQ is useful:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  user-service:
    ports:
      - "3001:3000"

  auth-service:
    ports:
      - "3002:3000"

  reservation-service:
    ports:
      - "3003:3000"

  charger-service:
    ports:
      - "3004:3000"

  analytics-service:
